<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Research Question</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="ai-page">
    <div class="container center">
        <h1 class="page-title">Ask a Research Question</h1>
        <p class="sub-header">Type any academic topic or question and find peer-reviewed sources.</p>

        <form action="/search" method="POST">
            <input type="text" name="query" placeholder="e.g. Effects of AI in healthcare" required>
            <br>
            <button type="submit">Search Research Papers</button>
        </form>

        <div class="center">
            <a href="/"><button>← Back to Home</button></a>
        </div>
    </div>
</body>

</html>
